  1.0.0:
    changes:
      release_summary: 'This release introduces a wide range of new modules, including support for DTC, IPAM Federation, DHCP, and Anycast configurations. It also includes enhancements to existing modules, bug fixes, and updates to documentation and CI workflows.'

      module_updates:

      - Added tag filter support for `next_available_ip_info` (#31)

      - Modified test cases for `next_available_subnet_info` (#45)

      - Refactored logic for `next_available_address_block` to improve modularity (#37)

      - Updated `modules.py` to enhance change detection for lists and dictionaries (#36)

      - Improved examples for DNS and DHCP Host modules (#40)

      - Minor corrections to `anycast_host` module, including required attributes and read-only fields (#42)



      bugfixes:

      - Fixed authentication handling in DNS modules (#2, #28)



      documentation:

      - Updated installation guide and added debugging information to README (#1, #19)

      - Updated README to include a link to Ansible Galaxy documentation (#9)

      - Updated `dns_record` documentation to remove extraneous commas (#50)

      - Documentation corrections for UDDI Ansible (#39)



      maintenance:

      - Upgraded universal-ddi-python SDK to v2.0 (#6)

      - Updated GitHub Actions workflows for testing and release (#3, #4, #10)

      - Updated runtime.yml to include Ansible version in meta directory (#8)

      - Added missing tests for various modules (#43)



